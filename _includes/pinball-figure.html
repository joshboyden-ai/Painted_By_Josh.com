<figure class="pinball-figure">
  {% if include.media.file and include.media.file != '' %}
    {% assign media_path = '/_projects/custom-electromechanical-pinball-machine/' | append: include.media.file %}
    <a href="{{ media_path | relative_url }}" target="_blank" rel="noopener noreferrer" aria-label="Open {{ include.media.title | escape }} image">
      <img src="{{ media_path | relative_url }}" alt="{{ include.media.alt | default: include.media.title | escape }}" loading="lazy">
    </a>
  {% else %}
    <div class="pinball-media-placeholder">
      <span class="pinball-placeholder-label">Image to add</span>
      <strong>{{ include.media.title }}</strong>
      <span>{{ include.media.prompt }}</span>
    </div>
  {% endif %}
  <figcaption>{{ include.media.caption | default: include.media.title }}</figcaption>
</figure>
